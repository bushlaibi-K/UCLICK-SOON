<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain · U Click</title>
<meta name="description" content="Brain — a free learning game for kids aged 4 to 12: math, science, Arabic, English, logic and learning to read, in Arabic and English.">
<meta property="og:title" content="Brain · U Click">
<meta property="og:description" content="Learning levels for kids aged 4 to 12, in Arabic and English.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://uclick.bh/brain/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#1d2b64; --bg2:#3a6073; --card:#ffffff; --ink:#22304a; --muted:#6b7890;
    --math:#ff8a3d; --sci:#27b97c; --eng:#3f8cff; --logic:#a45cf0; --ara:#e25588;
    --ok:#27b97c; --bad:#f25f6b; --gold:#ffc83d; --lock:#c5ccd8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Trebuchet MS","Cairo","Segoe UI",Tahoma,system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(165deg,var(--bg1),var(--bg2));min-height:100vh;padding:14px;display:flex;justify-content:center}
  html[lang="ar"] body{font-family:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif}
  .app{width:100%;max-width:760px}
  header{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:12px;gap:8px;flex-wrap:wrap}
  header h1{font-size:1.5rem;letter-spacing:.5px}
  header .tools{display:flex;gap:6px;flex-wrap:wrap}
  .card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 22px rgba(0,0,0,.22)}
  .hidden{display:none!important}
  button{font-family:inherit;cursor:pointer;border:none}
  .btn{border-radius:14px;padding:11px 16px;font-size:1rem;font-weight:bold;background:#e9eef7;color:var(--ink)}
  .btn.primary{background:var(--gold);color:#3b2c00}
  .btn.ghost{background:rgba(255,255,255,.18);color:#fff}
  .btn.danger{background:#fde3e5;color:#b3202e}
  .btn:focus-visible,.opt:focus-visible,.subj:focus-visible,.chip:focus-visible,.kid:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
  h2{font-size:1.25rem;margin-bottom:10px}
  p.sub{color:var(--muted);margin-bottom:12px}
  .kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .kid{background:#f3f6fc;border-radius:18px;padding:14px 8px;text-align:center;font-size:1rem;font-weight:bold;color:var(--ink)}
  .kid .av{font-size:2.6rem;display:block}
  .kid small{display:block;color:var(--muted);font-weight:normal;margin-top:2px}
  .form label{display:block;font-weight:bold;margin:10px 0 6px}
  .form input{width:100%;padding:12px;border-radius:12px;border:2px solid #d5dcea;font-size:1.1rem;font-family:inherit}
  .ages,.avs{display:flex;flex-wrap:wrap;gap:8px}
  .pick{min-width:46px;padding:10px;border-radius:12px;background:#eef2f9;font-size:1.1rem;font-weight:bold;color:var(--ink)}
  .pick.on{background:var(--gold)}
  .who{display:flex;align-items:center;gap:12px}
  .who .av{font-size:2.8rem}
  .badge{display:inline-block;border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:bold;background:#e7f7ef;color:#127a4c;margin-top:4px}
  .badge.up{background:#fff3cf;color:#8a6100}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px}
  .chip{flex:0 0 auto;border-radius:16px;padding:10px 14px;font-weight:bold;background:#eef2f9;color:var(--ink);text-align:center;min-width:92px}
  .chip small{display:block;font-weight:normal;color:var(--muted);font-size:.75rem}
  .chip.sel{background:var(--ink);color:#fff}.chip.sel small{color:#cfd8ea}
  .chip.locked{background:#f1f3f7;color:#a3acbb}
  .subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .subj{border-radius:20px;padding:18px 10px;color:#fff;font-size:1.15rem;font-weight:bold;text-align:center}
  .subj:last-child:nth-child(odd){grid-column:1 / -1}
  .subj .ic{font-size:2.4rem;display:block;margin-bottom:4px}
  .subj small{display:block;font-weight:normal;opacity:.95;margin-top:4px}
  .bar{height:14px;background:#e6ebf4;border-radius:10px;overflow:hidden;margin:10px 0 16px}
  .bar div{height:100%;background:var(--ok);width:0;transition:width .3s}
  .q{font-size:1.7rem;font-weight:bold;text-align:center;margin:8px 0 18px;line-height:1.5;word-break:break-word}
  .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .opts.long{grid-template-columns:1fr}
  .opt{border-radius:18px;padding:18px 10px;font-size:1.6rem;font-weight:bold;background:#eef2f9;color:var(--ink);min-height:74px}
  .opts.long .opt{font-size:1.15rem;padding:16px 12px}
  .opt.right{background:var(--ok);color:#fff}
  .opt.wrong{background:var(--bad);color:#fff}
  .fb{min-height:2rem;text-align:center;font-size:1.25rem;font-weight:bold;margin-top:14px}
  .center{text-align:center}
  .big{font-size:4rem}
  .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
  .rep{border:2px solid #e6ebf4;border-radius:18px;padding:14px;margin-bottom:12px}
  .rep h3{font-size:1.15rem}
  .line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eef1f6;font-size:.95rem}
  .line:last-child{border-bottom:none}
  .line b{white-space:nowrap}
  .line small{color:var(--muted)}
  .ladder{display:flex;gap:4px;margin:10px 0}
  .ladder span{flex:1;height:12px;border-radius:6px;background:#e6ebf4}
  .ladder span.done{background:var(--ok)}
  .ladder span.now{background:var(--gold)}
  .ladder span.age{outline:2px solid var(--ink);outline-offset:1px}
  .note{font-size:.85rem;color:var(--muted);margin-top:8px}
  .opt.reading{outline:5px solid var(--gold);outline-offset:2px;background:#fff6d6}
  .speak{font-size:1.8rem;width:64px;height:64px;border-radius:50%;background:var(--gold);box-shadow:0 4px 0 #d9a520}
  .mascot{display:flex;align-items:center;gap:10px;margin-top:14px;min-height:64px}
  .mascot .owl{font-size:2.6rem}
  .bubble{flex:1;background:#f3f6fc;border-radius:16px;padding:10px 12px;margin-top:0;min-height:48px;text-align:start}
  .stickers{display:flex;flex-wrap:wrap;gap:8px;font-size:2rem}
  .readBtn{display:block;width:100%;border-radius:22px;padding:18px;margin-bottom:14px;font-size:1.3rem;font-weight:bold;color:#3b2c00;background:linear-gradient(90deg,#ffd76a,#ffb347);box-shadow:0 8px 22px rgba(0,0,0,.22)}
  .steps{display:grid;gap:10px}
  .step{border-radius:16px;padding:16px;font-size:1.15rem;font-weight:bold;background:#eef2f9;color:var(--ink);text-align:start}
  .tokens{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 10px}
  .tok{font-size:2.6rem;font-weight:bold;min-width:70px;padding:14px 16px;border-radius:18px;background:#eef2f9;color:var(--ink)}
  .tok:active{background:var(--gold)}
  .lsub{font-size:2rem;min-height:2.6rem;margin-bottom:6px}
  .confetti{position:fixed;top:-40px;font-size:1.8rem;animation:fall 2.4s linear forwards;pointer-events:none;z-index:9}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.confetti{display:none}}
  @media (max-width:420px){.q{font-size:1.4rem}.opt{font-size:1.35rem}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🧠 <span data-t="title"></span></h1>
    <div class="tools">
      <button class="btn ghost" id="soundBtn"></button>
      <button class="btn ghost" id="langBtn"></button>
      <button class="btn ghost hidden" id="switchBtn"></button>
      <button class="btn ghost" id="parentBtn"></button>
    </div>
  </header>

  <section id="sProfiles">
    <div class="card">
      <h2 data-t="who"></h2>
      <div class="kids" id="kidList"></div>
    </div>
  </section>

  <section id="sNew" class="hidden">
    <div class="card form">
      <h2 data-t="addChild"></h2>
      <label for="nameIn" data-t="name"></label>
      <input id="nameIn" maxlength="14" autocomplete="off">
      <label data-t="age"></label>
      <div class="ages" id="agePick"></div>
      <label data-t="face"></label>
      <div class="avs" id="avPick"></div>
      <div class="row">
        <button class="btn" id="cancelNew" data-t="cancel"></button>
        <button class="btn primary" id="saveNew" data-t="start"></button>
      </div>
      <div class="fb" id="newMsg" style="font-size:1rem;color:#b3202e"></div>
    </div>
  </section>

  <section id="sHome" class="hidden">
    <div class="card">
      <div class="who">
        <span class="av" id="hAv"></span>
        <div>
          <h2 id="hName" style="margin:0"></h2>
          <span class="badge" id="hBadge"></span> <span class="badge up hidden" id="hStreak"></span>
        </div>
      </div>
    </div>
    <button class="readBtn" id="readBtn" data-t="readBtn"></button>
    <div class="card">
      <h2 data-t="levels"></h2>
      <div class="chips" id="chips"></div>
      <p class="sub" id="stageHint"></p>
      <div class="subjects" id="subjects"></div>
    </div>
    <div class="card"><h2 id="stTitle"></h2><div class="stickers" id="stickers"></div><p class="sub hidden" id="stNone" data-t="noStickers" style="margin:0"></p></div>
  </section>

  <section id="sPlay" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <b id="pTitle"></b><span id="pCount" style="color:var(--muted)" dir="ltr"></span>
      </div>
      <div class="bar"><div id="pBar"></div></div>
      <div class="center"><button class="speak hidden" id="sayBtn" aria-label="Listen">🔊</button></div>
      <div class="q" id="pQ"></div>
      <div class="opts" id="pOpts"></div>
      <div class="mascot"><span class="owl">🦉</span><div class="fb bubble" id="pFb"></div></div>
    </div>
    <div class="center"><button class="btn ghost" id="quitBtn" data-t="back"></button></div>
  </section>

  <section id="sResult" class="hidden">
    <div class="card center">
      <div class="big" id="rEmoji"></div>
      <h2 id="rTitle"></h2>
      <div id="rStars" style="font-size:2rem"></div>
      <p id="rDetail"></p>
      <p id="rExtra" style="margin-top:10px;font-weight:bold;color:#8a6100"></p>
      <div class="row">
        <button class="btn" id="rAgain" data-t="again"></button>
        <button class="btn primary" id="rHome" data-t="toLevels"></button>
      </div>
    </div>
  </section>

  <section id="sRead" class="hidden">
    <div class="card">
      <h2 data-t="readTitle"></h2>
      <div class="ages" id="rdTabs" style="margin-bottom:12px"></div>
      <p class="sub" id="rdNote"></p>
      <div class="steps" id="rdSteps"></div>
    </div>
    <div class="center"><button class="btn ghost" id="rdBack" data-t="back"></button></div>
  </section>

  <section id="sLesson" class="hidden">
    <div class="card center">
      <div style="display:flex;justify-content:space-between;gap:8px"><b id="lTitle"></b><span id="lCount" dir="ltr" style="color:var(--muted)"></span></div>
      <div class="tokens" id="lTokens"></div>
      <div class="lsub" id="lSub"></div>
      <div class="row">
        <button class="btn" id="lPrev" data-t="prev"></button>
        <button class="speak" id="lSay" aria-label="Listen">🔊</button>
        <button class="btn" id="lNext" data-t="nextC"></button>
      </div>
      <div class="row"><button class="btn primary" id="lGame" data-t="listenGame"></button></div>
    </div>
    <div class="center"><button class="btn ghost" id="lBack" data-t="back"></button></div>
  </section>

  <section id="sGate" class="hidden">
    <div class="card center">
      <h2 data-t="parentsOnly"></h2>
      <p class="sub" data-t="gateHint"></p>
      <div class="q" id="gQ" dir="ltr"></div>
      <div class="opts" id="gOpts"></div>
      <div class="row"><button class="btn" id="gBack" data-t="back"></button></div>
    </div>
  </section>

  <section id="sParent" class="hidden">
    <div class="card">
      <h2 data-t="report"></h2>
      <p class="sub" data-t="reportHint"></p>
      <div id="reports"></div>
      <p class="note" data-t="deviceNote"></p>
      <div class="row"><button class="btn primary" id="pBack" data-t="done"></button></div>
    </div>
  </section>
</div>

  {id:"eng",   ic:"📖", col:"var(--eng)"},

const $ = id => document.getElementById(id);
const R = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[R(0,arr.length-1)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function numOpts(ans, spread, allowNeg){
  const set = new Set([ans]); let guard = 0;
  while(set.size < 4 && guard++ < 200){
    let d = R(1, Math.max(2, spread)); if(Math.random()<.5) d = -d;
    const v = Math.round((ans + d)*100)/100;
    if(v < 0 && !allowNeg) continue;
    set.add(v);
  }
  let n = 1; while(set.size < 4){ set.add(ans + spread + n++); }
  return shuffle([...set]);
}
const Q = (q,a,opts) => ({q, a:String(a), opts:opts.map(String)});
const uniq4 = (list, ans) => shuffle([...new Set(list.map(String))].slice(0,4));

/* ================= VOICE ================= */
let ttsNS=null, synth=null, speakTok=0, actx=null;
try{ synth = window.speechSynthesis || null; }catch(e){}
const voiceReady = () => !!(ttsNS || synth);
const soundOn = () => data.sound !== false;
function cleanSay(x, lg){
  return String(x).replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}]/gu," ").replace(/_{2,}/g, TXT[lg||LANG].mw.blank)
    .replace(/\s+/g," ").replace(/([\s.,،]*)$/,"").trim();
}
function mathSay(x, lg){ const w=TXT[lg].mw;
  return x.replace(/\s*=\s*\?/g,w.eq).replace(/\s*\+\s*/g,w.plus).replace(/\s*−\s*/g,w.minus).replace(/\s*×\s*/g,w.times).replace(/\s*÷\s*/g,w.div).replace(/²/g,w.sq); }
function markReading(id){ document.querySelectorAll("#pOpts .opt").forEach((b,i)=>b.classList.toggle("reading", id==="o"+i)); }
function pickVoice(lg){ try{ return synth.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith(lg)) || null; }catch(e){ return null; } }
function speak(lines){
  lines = lines.filter(l=>l && l.text); if(!lines.length || !voiceReady()) return;
  const tok=++speakTok; markReading(null);
  if(ttsNS){
    try{
      ttsNS.speak(lines.map(l=>{ const o={text:l.text, language:l.lang, rate:0.9}; if(l.id) o.id=l.id; return o; }), {voice:"rounded"})
        .then(()=>{ if(tok===speakTok) markReading(null); })
        .catch(e=>{ if(tok===speakTok) markReading(null); if(e && e.code==="not_granted"){ ttsNS=null; } });
    }catch(e){}
    return;
  }
  try{
    synth.cancel();
    lines.forEach((l,i)=>{ const u=new SpeechSynthesisUtterance(l.text); u.lang = l.lang==="ar" ? "ar-SA" : "en-US"; u.rate=0.85;
      const v=pickVoice(l.lang); if(v) u.voice=v;
      u.onstart=()=>{ if(tok===speakTok) markReading(l.id||null); };
      if(i===lines.length-1) u.onend=()=>{ if(tok===speakTok) markReading(null); };
      synth.speak(u); });
  }catch(e){}
}
function stopSpeak(){ speakTok++; markReading(null); try{ if(ttsNS) ttsNS.stop(); else if(synth) synth.cancel(); }catch(e){} }
function beep(ok){
  if(!soundOn()) return;
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), n=actx.currentTime; o.connect(g); g.connect(actx.destination); o.type="sine";
    if(ok){ o.frequency.setValueAtTime(660,n); o.frequency.setValueAtTime(880,n+.12); } else o.frequency.setValueAtTime(220,n);
    g.gain.setValueAtTime(.15,n); g.gain.exponentialRampToValueAtTime(.001,n+.3); o.start(n); o.stop(n+.32);
  }catch(e){}
}
function confetti(){
  for(let i=0;i<26;i++){ const c=document.createElement("span"); c.className="confetti"; c.textContent=pick(["🎉","⭐","🎈","✨","🌟"]);
    c.style.left=R(0,95)+"vw"; c.style.animationDelay=(R(0,8)/10)+"s"; document.body.appendChild(c); setTimeout(()=>c.remove(),3600); }
}

const THINGS = ["🍎","⭐","🐟","⚽","🌸","🚗","🍪","🎈"];
function genMath(s){
  let a,b,c,r,k;
  switch(s){
    case 1: a=R(1,5); return Q(t("howMany")+"\n"+pick(THINGS).repeat(a), a, numOpts(a,2));
    case 2:
      if(Math.random()<.5){ a=R(4,10); return Q(t("howMany")+"\n"+pick(THINGS).repeat(a), a, numOpts(a,2)); }
      a=R(1,4); b=R(1,5-a); return Q(a+" + "+b+" = ?", a+b, numOpts(a+b,2));
    case 3:
      if(Math.random()<.5){ a=R(1,9); b=R(1,10-a); return Q(a+" + "+b+" = ?", a+b, numOpts(a+b,3)); }
      a=R(2,10); b=R(1,a); return Q(a+" − "+b+" = ?", a-b, numOpts(a-b,3));
    case 4:
      k=R(1,3);
      if(k===1){ a=R(5,15); b=R(2,20-a); return Q(a+" + "+b+" = ?", a+b, numOpts(a+b,4)); }
      if(k===2){ a=R(10,20); b=R(2,9); return Q(a+" − "+b+" = ?", a-b, numOpts(a-b,4)); }
      a=R(1,8)*10; b=R(1,9-a/10)*10; return Q(a+" + "+b+" = ?", a+b, shuffle([a+b,a+b+10,a+b-10,a+b+20]));
    case 5:
      k=R(1,3);
      if(k===1){ a=R(12,60); b=R(11,39); return Q(a+" + "+b+" = ?", a+b, numOpts(a+b,10)); }
      if(k===2){ a=R(40,99); b=R(11,39); return Q(a+" − "+b+" = ?", a-b, numOpts(a-b,10)); }
      a=pick([2,5,10]); b=R(2,10); return Q(b+" × "+a+" = ?", a*b, numOpts(a*b,a*2));
    case 6:
      if(Math.random()<.55){ a=R(3,10); b=R(3,10); return Q(a+" × "+b+" = ?", a*b, numOpts(a*b,8)); }
      b=R(2,10); a=b*R(2,10); return Q(a+" ÷ "+b+" = ?", a/b, numOpts(a/b,3));
    case 7:
      k=R(1,3);
      if(k===1){ a=R(11,25); b=R(3,9); return Q(a+" × "+b+" = ?", a*b, numOpts(a*b,12)); }
      if(k===2){ b=R(3,9); a=b*R(11,20); return Q(a+" ÷ "+b+" = ?", a/b, numOpts(a/b,4)); }
      b=pick([2,3,4,5]); a=b*R(3,12); return Q(t("fracOf")(b,a), a/b, numOpts(a/b,4));
    case 8:
      k=R(1,3);
      if(k===1){ a=pick([10,20,25,50,75]); b=pick([40,60,80,120,200]); return Q(t("pct")(a,b), a*b/100, numOpts(a*b/100,10)); }
      if(k===2){ a=R(11,89)/10; b=R(11,89)/10; r=Math.round((a+b)*10); return Q(a.toFixed(1)+" + "+b.toFixed(1)+" = ?", (r/10).toFixed(1), numOpts(r,12).map(v=>(v/10).toFixed(1))); }
      b=pick([4,5,8,10]); a=R(1,b-1); c=R(1,b-a);
      return Q(a+"/"+b+" + "+c+"/"+b+" = ?", (a+c)+"/"+b, uniq4([(a+c)+"/"+b,(a+c)+"/"+(b*2),(a+c+1)+"/"+b,(a+c+2)+"/"+b,(a+c+3)+"/"+b]));
    default:
      k=R(1,4);
      if(k===1){ a=R(2,12); b=R(13,25); return Q(a+" − "+b+" = ?", a-b, numOpts(a-b,5,true)); }
      if(k===2){ a=R(2,9); b=R(2,9); c=R(2,9); r=a+b*c; return Q(a+" + "+b+" × "+c+" = ?", r, uniq4([r,(a+b)*c,a+b+c,r+1,r-1,r+2])); }
      if(k===3){ a=R(3,15); b=R(a+2,40); return Q(t("xeq")(a,b), b-a, numOpts(b-a,5)); }
      a=R(4,15); return Q(a+"² = ?", a*a, numOpts(a*a,15));
  }
}

/* ================= LOGIC (made fresh every round) ================= */
const SHAPES = ["🔴","🔵","🟡","🟢","🟣","🟠"];
function emojiPattern(kind){
  const e = shuffle(SHAPES); let unit;
  if(kind===1) unit=[e[0],e[1]];
  else if(kind===2) unit=[e[0],e[0],e[1]];
  else unit=[e[0],e[1],e[2]];
  const len = kind===1 ? 5 : 6;
  const seq=[]; for(let i=0;i<len;i++) seq.push(unit[i%unit.length]);
  const ans = unit[len%unit.length];
  const others = shuffle(SHAPES.filter(x=>x!==ans)).slice(0,3);
  return Q(t("next")+"\n"+seq.join(" ")+" ❓", ans, shuffle([ans,...others]));
}
function seqQ(terms, next, spread){ return Q(t("next")+"\n"+terms.join(", ")+", ❓", next, numOpts(next, spread)); }
function genLogic(s){
  let a,d,k,x;
  switch(s){
    case 1: return emojiPattern(1);
    case 2: return emojiPattern(R(1,3));
    case 3:
      if(Math.random()<.5) return emojiPattern(R(2,3));
      a=R(1,12); return seqQ([a,a+1,a+2,a+3], a+4, 2);
    case 4: d=pick([2,5,10]); a=R(1,10); return seqQ([a,a+d,a+2*d,a+3*d], a+4*d, d+2);
    case 5:
      d=R(3,9);
      if(Math.random()<.5){ a=R(1,20); return seqQ([a,a+d,a+2*d,a+3*d], a+4*d, 4); }
      a=R(50,90); return seqQ([a,a-d,a-2*d,a-3*d], a-4*d, 4);
    case 6:
      if(Math.random()<.5){ a=R(1,5); return seqQ([a,a*2,a*4,a*8], a*16, 8); }
      d=R(11,25); a=R(5,40); return seqQ([a,a+d,a+2*d,a+3*d], a+4*d, 6);
    case 7:
      if(Math.random()<.5){ a=R(1,4); return seqQ([a,a*3,a*9,a*27], a*81, 20); }
      d=R(2,6); x=R(7,12); a=R(1,15); return seqQ([a,a+d,a+d+x,a+2*d+x,a+2*d+2*x], a+3*d+2*x, 5);
    case 8:
      if(Math.random()<.5){ a=R(1,6); return seqQ([a*a,(a+1)**2,(a+2)**2,(a+3)**2], (a+4)**2, 9); }
      a=R(1,20); d=R(1,4); return seqQ([a,a+d,a+2*d+1,a+3*d+3,a+4*d+6], a+5*d+10, 5);
    default:
      k=R(1,3);
      if(k===1){ a=R(1,6); x=R(a,9); const f=[a,x]; for(let i=0;i<4;i++) f.push(f[f.length-1]+f[f.length-2]); return seqQ(f.slice(0,5), f[5], 7); }
      if(k===2){ a=R(1,5); const g=[a]; for(let i=0;i<4;i++) g.push(g[g.length-1]*2+1); return seqQ(g.slice(0,4), g[4], 6); }
      a=R(1,4); return seqQ([a**3,(a+1)**3,(a+2)**3], (a+3)**3, 20);
  }
}

function buildRound(subj, stage){
  if(subj==="math" || subj==="logic"){
    const gen = subj==="math" ? genMath : genLogic, out=[], seen=new Set(); let guard=0;
    while(out.length<ROUND && guard++<300){ const q=gen(stage); if(seen.has(q.q)) continue;
      if(q.opts.length!==4 || new Set(q.opts).size!==4 || !q.opts.includes(q.a)) continue; seen.add(q.q); out.push(q); }
    while(out.length<ROUND) out.push(gen(stage));
    return out;
  }
  const bank = subj==="sci" && LANG==="ar" ? BANK.sci_ar : BANK[subj];
  return shuffle(bank[stage]).slice(0,ROUND).map(r => Q(r[0], r[1], shuffle(r.slice(1))));
}

const best = (k,sub,s) => (k.best[sub] && k.best[sub][s]) || 0;
const stagePassed = (k,s) => SUBJ.every(x => best(k,x.id,s) >= PASS);
function unlocked(k){ let u=stageOfAge(k.age); while(u<STAGES && stagePassed(k,u)) u++; return u; }
function levelLabel(k){
  const u=unlocked(k), champion = u===STAGES && stagePassed(k,STAGES);
  const diff = ageOf(u) - k.age;
  let txt = champion ? t("champ") : t("workingAt")(ageOf(u)), up=false;
  if(diff>0){ txt += t("ahead")(diff); up=true; }
  else if(!champion) txt += t("onTrack");
  return {txt, up, u, champion};
}

/* ================= PLAY ================= */
let round=[], qi=0, score=0, busy=false, curSub=null, curStage=1, timer=null, missed=[], review=false, readMode=null;
const subLang = () => readMode ? readMode.lang : curSub==="eng" ? "en" : curSub==="ara" ? "ar" : LANG;
const small = () => !!readMode || curStage<=3;      // youngest levels: questions are read aloud
function startRound(sub, stage){ readMode=null; curSub=sub; curStage=stage; round=buildRound(sub,stage); begin(); }
function begin(){ qi=0; score=0; missed=[]; review=false; show("sPlay"); renderQ(true); }
function qLines(it, first){
  if(it.say) return (first ? [{text:cleanSay(it.q, LANG), lang:LANG}] : []).concat(it.say);
  const lg=subLang(); let txt=cleanSay(it.q.replace(/\n/g," , "), lg);
  if(curSub==="math") txt=mathSay(txt, lg);
  const lines=[{text:txt, lang:lg}];
  it.opts.forEach((o,i)=>{ const c=cleanSay(o, lg); if(c && /\p{L}/u.test(c)) lines.push({text:c, lang:lg, id:"o"+i}); });
  return lines;
}
function renderQ(first){
  busy=false; const list=review?missed:round, it=list[qi], x=SUBJ.find(v=>v.id===curSub);
  $("pTitle").textContent = review ? t("reviewTitle") : readMode ? "🎧 "+t("rs"+(readMode.step+1)) : x.ic+" "+t("s_"+curSub)+" · "+t("levelN")(curStage);
  $("pCount").textContent=(qi+1)+" / "+list.length;
  $("pBar").style.width=(qi/list.length*100)+"%";
  const qb=$("pQ"); qb.innerHTML="";
  it.q.split("\n").forEach(line=>{ const d=document.createElement("div"); d.dir="auto"; d.textContent=line; qb.appendChild(d); });
  $("pFb").textContent="";
  const box=$("pOpts"); box.innerHTML="";
  box.classList.toggle("long", it.opts.some(o=>o.length>12));
  it.opts.forEach(o=>{ const b=document.createElement("button"); b.className="opt"; b.dir="auto"; b.textContent=o;
    b.onclick=()=>answer(b,o); box.appendChild(b); });
  $("sayBtn").classList.toggle("hidden", !voiceReady());
  if(readMode || (small() && soundOn())) speak(qLines(it, !!first));
}
$("sayBtn").onclick=()=>{ const it=(review?missed:round)[qi]; if(it && !busy) speak(qLines(it, false)); };
function answer(btn,val){
  if(busy) return; busy=true; stopSpeak();
  const it=(review?missed:round)[qi], ok = val===it.a, k=kid();
  if(!review){
    if(!readMode){ k.stats[curSub]=k.stats[curSub]||{c:0,t:0}; k.stats[curSub].t++; if(ok) k.stats[curSub].c++; }
    if(ok) score++; else missed.push(it);
  }
  beep(ok);
  if(ok){ const msg=pick(t("good")); btn.classList.add("right"); $("pFb").textContent=msg;
    if(small() && soundOn()) speak([{text:cleanSay(msg, LANG), lang:LANG}]); }
  else{ btn.classList.add("wrong"); [...$("pOpts").children].forEach(b=>{ if(b.textContent===it.a) b.classList.add("right"); });
    $("pFb").textContent=t("answerIs")(it.a);
    if(readMode) speak(it.say);
    else if(small() && soundOn()){ const a=cleanSay(it.a, subLang()); speak(a ? [{text:t("answerSay"), lang:LANG},{text:a, lang:subLang()}] : [{text:t("lookSay"), lang:LANG}]); } }
  timer=setTimeout(nextQ, ok?1200:2600);
}
function nextQ(){
  const list=review?missed:round; qi++;
  if(qi<list.length){ renderQ(); return; }
  if(!review && missed.length){ review=true; qi=0; missed=missed.map(q=>Object.assign({}, q, {opts:shuffle(q.opts)})); renderQ(); return; }
  if(readMode) finishRead(); else finish();
}
$("quitBtn").onclick=()=>{ clearTimeout(timer); save(); if(readMode) renderRead(); else renderHome(); };

function finish(){
  const k=kid(), before=unlocked(k), wasPassed=stagePassed(k,curStage), oldBest=best(k,curSub,curStage);
  k.best[curSub]=k.best[curSub]||{};
  k.best[curSub][curStage]=Math.max(oldBest, score);
  touchDay(k); save();
  const after=unlocked(k), passed=score>=PASS, nowPassed=stagePassed(k,curStage);
  $("rEmoji").textContent = passed ? (score===ROUND?"🏆":"🌟") : "🌈";
  $("rTitle").textContent = passed ? t("youPassed") : t("almost");
  $("rStars").textContent = passed ? starStr(score) : "";
  $("rDetail").textContent = t("got")(score, passed);
  let extra="";
  if(after>before){ extra=t("opened")(after, ageOf(after)); if(ageOf(after)>k.age) extra+=t("above"); selStage=after; }
  else if(nowPassed && !wasPassed && curStage===STAGES) extra=t("champion");
  else if(passed && !nowPassed) extra=t("stillLeft")(SUBJ.filter(x=>best(k,x.id,curStage)<PASS).map(x=>t("s_"+x.id)).join(LANG==="ar"?"، ":", "));
  if(passed && oldBest<PASS) extra+=t("newSticker")(stickerOf(curSub,curStage));
  $("rExtra").textContent=extra; $("rHome").textContent=t("toLevels");
  show("sResult");
  if(passed) confetti();
  if(small() && soundOn()) speak([{text:cleanSay($("rTitle").textContent, LANG), lang:LANG}]);
}
function finishRead(){
  const k=kid(), n=round.length, passed=score>=n-1; k.read=k.read||{};
  if(passed) k.read[readMode.lang+readMode.step]=true;
  touchDay(k); save();
  $("rEmoji").textContent = passed ? "🏆" : "🌈";
  $("rTitle").textContent = passed ? t("stepDone") : t("almost");

  $("rDetail").textContent = t("gotN")(score, n, passed);

  show("sResult");
  if(passed) confetti();
  if(soundOn()) speak([{text:cleanSay($("rTitle").textContent, LANG), lang:LANG}]);
}

    h+='<div class="line"><span>'+t("streakLbl")+'</span><b>'+curStreak(k)+'</b></div>';
    h+='<div class="line"><span>'+t("lastPlayed")+'</span><b>'+(k.last?new Date(k.last).toLocaleDateString("en-GB"):t("notYet"))+'</b></div>';
    h+='<div class="row" style="justify-content:flex-start"><button class="btn danger" data-del="'+k.id+'">'+t("remove")+'</button></div>';
    div.innerHTML=h; box.appendChild(div);
  });
  box.querySelectorAll("[data-del]").forEach(b=>{
    let armed=false;
    b.onclick=()=>{ if(!armed){ armed=true; b.textContent=t("removeSure"); setTimeout(()=>{armed=false;b.textContent=t("remove");},3000); return; }
      data.kids=data.kids.filter(k=>k.id!==b.dataset.del); if(data.cur===b.dataset.del) data.cur=null; save(); renderParent(); };
  });
  show("sParent");
}

/* ================= START ================= */
load();
LANG = data.lang || ((navigator.language||"").toLowerCase().startsWith("ar") ? "ar" : "en");
applyLang();
if(kid()) renderHome(); else renderProfiles();
try{ if(window.claude && window.claude.use) window.claude.use("tts").then(ns=>{ if(!ns) return; ttsNS=ns;
  try{ ns.onLine(({id})=>markReading(id||null)); }catch(e){}
  if(screen==="sPlay") $("sayBtn").classList.remove("hidden");
  if(screen==="sRead") renderRead(); }).catch(()=>{}); }catch(e){}
try{ if(synth && synth.getVoices) synth.getVoices(); }catch(e){}
</script>
